<meta charset="UTF-8">

<title>Parcours de terrain</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

:root {
  --bg: #FAF8F3;
  --text: #1E1C18;
  --meta: #7A7060;
  --border: #DDD6C5;
  --shadow: rgba(20,16,8,.16);
  --r: 8px;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, sans-serif;
  --pal: #BF6B28;
  --neo: #4E7A55;
  --med: #3D5291;
  --edu: #6B5D42;
}

#map { width:100%; height:100%; }

.panel {
  position: fixed;
  z-index: 900;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 4px 24px var(--shadow);
}

/* Identity card */
#id-card { top:16px; left:16px; width:270px; padding:16px 15px 14px; }
#id-card .name { font-family:var(--serif); font-size:1.12rem; font-weight:bold; color:var(--text); letter-spacing:.01em; }
#id-card .sub { font-family:var(--sans); font-size:.67rem; letter-spacing:.08em; text-transform:uppercase; color:var(--meta); margin-top:3px; margin-bottom:11px; }
.rule { height:1px; background:var(--border); margin:9px 0; }
.kv { display:grid; grid-template-columns:74px minmax(0,1fr); gap:4px 8px; margin-bottom:7px; align-items:start; }
.kl { font-family:var(--sans); font-size:.62rem; text-transform:uppercase; letter-spacing:.045em; color:var(--meta); padding-top:2px; white-space:nowrap; }
.kv-val { font-family:var(--sans); font-size:.74rem; color:var(--text); line-height:1.35; min-width:0; }
.tools { font-family:var(--sans); font-size:.69rem; color:var(--meta); line-height:1.75; margin-top:2px; }
.tools b { color:var(--text); font-weight:600; }
#id-card a.site { display:inline-block; margin-top:10px; font-family:var(--sans); font-size:.71rem; color:var(--med); text-decoration:none; }
#id-card a.site:hover { text-decoration:underline; }

/* Sélecteur de langue */
.langs { display:flex; gap:4px; flex-wrap:wrap; }
.lang-btn {
  font-family:var(--sans); font-size:.7rem; font-weight:600; letter-spacing:.04em;
  color:var(--meta); background:transparent;
  border:1px solid var(--border); border-radius:4px;
  padding:1px 7px; cursor:pointer; line-height:1.5;
}
.lang-btn:hover { color:var(--text); border-color:var(--meta); }
.lang-btn.active { color:#fff; background:var(--text); border-color:var(--text); }
.lang-btn:focus-visible { outline:2px solid var(--med); outline-offset:1px; }

/* Legend */
#legend { bottom:24px; right:16px; padding:11px 14px; max-width:240px; }
.leg-head { font-family:var(--sans); font-size:.63rem; text-transform:uppercase; letter-spacing:.08em; color:var(--meta); margin-bottom:8px; }
.leg-row { display:flex; align-items:center; gap:7px; font-family:var(--sans); font-size:.74rem; color:var(--text); margin-bottom:5px; }
.leg-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px var(--shadow); flex-shrink:0; }
.leg-note { font-family:var(--sans); font-size:.64rem; color:var(--meta); line-height:1.4; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }

/* Badge */
#badge { bottom:24px; left:16px; padding:8px 12px; font-family:var(--sans); font-size:.69rem; color:var(--meta); letter-spacing:.02em; max-width:calc(100vw - 300px); }

/* Popups */
.leaflet-popup-content-wrapper {
  padding:0 !important; border-radius:8px !important;
  box-shadow:0 6px 28px var(--shadow) !important;
  border:1px solid var(--border) !important;
  overflow:hidden; background:var(--bg) !important;
}
.leaflet-popup-content { margin:0 !important; }
.leaflet-popup-tip { background:var(--bg); }
.leaflet-popup-close-button { color:var(--meta) !important; font-size:18px !important; top:6px !important; right:8px !important; }

.pop-stripe { height:4px; width:100%; }
.pop-body { padding:12px 14px 14px; width:270px; }
.pop-name { font-family:var(--serif); font-size:.93rem; color:var(--text); line-height:1.3; margin-bottom:3px; }
.pop-period { font-family:var(--sans); font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; font-weight:600; margin-bottom:7px; }
.pop-meta { font-family:var(--sans); font-size:.71rem; color:var(--meta); margin-bottom:2px; }
.pop-role { font-family:var(--sans); font-size:.76rem; color:var(--text); font-style:italic; margin-bottom:8px; }
.pop-rule { height:1px; background:var(--border); margin:8px 0; }
.pop-desc { font-family:var(--serif); font-size:.77rem; color:#3A3730; line-height:1.56; margin-bottom:10px; }
.pop-skills { display:flex; flex-wrap:wrap; gap:3px; }
.pop-skill { font-family:var(--sans); font-size:.62rem; color:var(--meta); border:1px solid var(--border); border-radius:3px; padding:1px 5px; background:#fff; }

/* Onglets (marqueurs regroupés) */
.tabs { display:flex; background:#F1EDE1; border-bottom:1px solid var(--border); padding-right:28px; }
.tab {
  flex:1 1 auto; min-width:0;
  font-family:var(--sans); font-size:.66rem; font-weight:600;
  color:var(--meta); background:transparent; border:0;
  border-bottom:3px solid transparent;
  padding:8px 6px 6px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--text); background:var(--bg); border-bottom-color:var(--c); }
.entry[hidden] { display:none; }

.leaflet-tooltip { background:var(--bg); border:1px solid var(--border); border-radius:4px; font-family:var(--sans); font-size:.71rem; color:var(--text); box-shadow:0 2px 8px var(--shadow); padding:3px 7px; }
.leaflet-tooltip-top::before { border-top-color:var(--border); }
.leaflet-tooltip-bottom::before { border-bottom-color:var(--border); }
</style>
</head>

/* ═══════════════════════════════════════════════
   3. CARTE
   ═══════════════════════════════════════════════ */
const C = { pal:"#BF6B28", neo:"#4E7A55", med:"#3D5291", edu:"#6B5D42" };
const LANGS = ["fr","en","it","la"];
let lang = "fr";

const map = L.map("map", { center:[46.2, 4.5], zoom:5, zoomControl:false });
L.control.zoom({ position:"topright" }).addTo(map);

L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3wab_1_6062fa988a8e0a1daff13680", {
  attribution:"© <a href='https://openstreetmap.org/copyright'>OpenStreetMap</a> · <a href='https://carto.com/attributions'>CARTO</a>",
  subdomains:"abcd", maxZoom:19
}).addTo(map);

const markerGroup = L.featureGroup().addTo(map);

function mkIcon(type, sz) {
  const col = C[type] || "#888";
  return L.divIcon({
    className: "",
    html: `<div style="width:${sz}px;height:${sz}px;background:${col};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(20,16,8,.3);transition:transform .12s ease, box-shadow .12s ease;cursor:pointer;"></div>`,
    iconSize:[sz,sz], iconAnchor:[sz/2, sz/2], popupAnchor:[0, -(sz/2 + 5)]
  });
}

function mkHubIcon(entries) {
  const sz = 28, n = entries.length;
  const stops = entries.map((s, i) =>
    `${C[s.type] || "#888"} ${(i*100/n).toFixed(1)}% ${((i+1)*100/n).toFixed(1)}%`).join(", ");
  return L.divIcon({
    className: "",
    html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:conic-gradient(${stops});border:2.5px solid #fff;box-shadow:0 2px 8px rgba(20,16,8,.3);display:flex;align-items:center;justify-content:center;transition:transform .12s ease, box-shadow .12s ease;cursor:pointer;"><span style="width:15px;height:15px;border-radius:50%;background:#fff;color:#1E1C18;font:700 .64rem/15px system-ui,sans-serif;text-align:center;">${n}</span></div>`,
    iconSize:[sz,sz], iconAnchor:[sz/2, sz/2], popupAnchor:[0, -(sz/2 + 5)]
  });
}

function entryHTML(s) {
  const t = s[lang], col = C[s.type] || "#888";
  const chips = t.skills.map(k => `<span class="pop-skill">${k}</span>`).join("");
  const link = s.link
    ? ` <a href="${s.link}" target="_blank" rel="noopener noreferrer">${t.linkLabel}</a>` : "";
  return `
    <div class="pop-stripe" style="background:${col}"></div>
    <div class="pop-body">
      <div class="pop-name">${t.name}</div>
      <div class="pop-period" style="color:${col}">${t.period}</div>
      <div class="pop-meta">📅 ${s.years}</div>
      <div class="pop-role">${t.role}</div>
      <div class="pop-rule"></div>
      <p class="pop-desc">${t.desc}${link}</p>
      <div class="pop-skills">${chips}</div>
    </div>`;
}

function hubHTML(entries) {
  const tabs = entries.map((s, i) =>
    `<button type="button" class="tab${i === 0 ? " active" : ""}" data-i="${i}" style="--c:${C[s.type] || "#888"}">${s[lang].tab || s[lang].name}</button>`
  ).join("");
  const bodies = entries.map((s, i) =>
    `<div class="entry" data-i="${i}"${i === 0 ? "" : " hidden"}>${entryHTML(s)}</div>`
  ).join("");
  return `<div class="tabs">${tabs}</div>${bodies}`;
}

function hoverFx(m) {
  m.on("mouseover", function () {
    const d = this._icon && this._icon.querySelector("div");
    if (d) { d.style.transform = "scale(1.3)"; d.style.boxShadow = "0 4px 14px rgba(20,16,8,.4)"; }
  });
  m.on("mouseout", function () {
    const d = this._icon && this._icon.querySelector("div");
    if (d) { d.style.transform = "scale(1)"; d.style.boxShadow = "0 2px 8px rgba(20,16,8,.3)"; }
  });
}

/* (Re)construit tous les marqueurs dans la langue courante */
function renderMarkers() {
  map.closePopup();
  markerGroup.clearLayers();

  const groups = new Map();
  SITES.forEach((s, idx) => {
    const key = s.hub || ("site" + idx);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });

  groups.forEach((entries, key) => {
    let m;
    if (entries.length === 1) {
      const s = entries[0];
      m = L.marker(s.coords, { icon: mkIcon(s.type, s.sz) });
      m.bindPopup(entryHTML(s), { maxWidth:310 });
      m.bindTooltip(s[lang].name.split("·")[0].trim(), { direction:"top", offset:[0, -(s.sz/2 + 3)] });
    } else {
      m = L.marker(entries[0].coords, { icon: mkHubIcon(entries) });
      /* Le contenu est un vrai nœud DOM (et non une chaîne HTML) : Leaflet le
         réutilise tel quel lors de popup.update(), donc les onglets gardent
         leurs écouteurs et leur état. */
      const wrap = document.createElement("div");
      wrap.innerHTML = hubHTML(entries);
      wrap.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = btn.dataset.i;
          wrap.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
          wrap.querySelectorAll(".entry").forEach(x => { x.hidden = (x.dataset.i !== i); });
          m.getPopup().update();
        });
      });
      m.bindPopup(wrap, { maxWidth:310 });
      const label = (HUBS[key] && HUBS[key][lang]) || key;
      m.bindTooltip(`${label} · ${entries.length} ${UI[lang].entries}`, { direction:"top", offset:[0, -17] });
    }
    hoverFx(m);
    markerGroup.addLayer(m);
  });
}

/* ═══════════════════════════════════════════════
   4. CHANGEMENT DE LANGUE
   ═══════════════════════════════════════════════ */
function applyUI() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll(".lang-btn").forEach(b => {
    const on = b.dataset.lang === lang;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}

function setLang(l, persist) {
  if (!LANGS.includes(l)) l = "fr";
  lang = l;
  applyUI();
  renderMarkers();
  if (persist) {
    try { localStorage.setItem("cv-carto-lang", l); } catch (e) {}
    try {
      const u = new URL(location.href);
      u.searchParams.set("lang", l);
      history.replaceState(null, "", u);
    } catch (e) {}
  }
}

document.querySelectorAll(".lang-btn").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang, true));
});

/* Langue initiale : ?lang=xx  >  choix mémorisé  >  langue du navigateur (fr/en/it)  >  fr */
function initialLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(q)) return q;
  } catch (e) {}
  try {
    const s = localStorage.getItem("cv-carto-lang");
    if (LANGS.includes(s)) return s;
  } catch (e) {}
  const nav = (navigator.language || "fr").slice(0, 2).toLowerCase();
  return LANGS.includes(nav) ? nav : "fr";
}

setLang(initialLang(), false);
if (markerGroup.getLayers().length) {
  map.fitBounds(markerGroup.getBounds().pad(0.18));
}
</script>
